<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicación en Salud · Flashcards</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--mute:#6b7785;--acc:#0f766e;--acc2:#e8f3f2;--bd:#d9e0e6}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#1a232c;--ink:#e8eef3;--mute:#93a1ae;--acc:#2dd4bf;--acc2:#16302e;--bd:#2b3743}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:560px;margin-bottom:12px}
select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.stat{color:var(--mute);font-size:.9rem;margin:6px 0}
.scene{width:100%;max-width:560px;margin:8px 0}
.card{position:relative;width:100%;cursor:pointer}
.face{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:44px 20px 40px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08);position:relative;animation:fade .25s}
.back{background:var(--acc2);display:none}
.card.flip .front{display:none}
.card.flip .back{display:flex}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.tag{position:absolute;top:12px;left:16px;font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.txt{font-size:1.15rem;line-height:1.5;word-break:break-word}
.term{font-size:1.6rem;word-break:break-word;font-weight:700;color:var(--acc)}
.hint{position:absolute;bottom:12px;font-size:.75rem;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<h1>Habilidades de comunicación en salud</h1>
<div class="bar">
  <select id="cat"></select>
  <select id="mode">
    <option value="d">Descripción → Término</option>
    <option value="t">Término → Descripción</option>
  </select>
  <select id="filt">
    <option value="all">Todas</option>
    <option value="rep">Solo a repasar</option>
  </select>
  <button id="shuf">Mezclar</button>
</div>
<div class="stat" id="stat"></div>
<div class="scene"><div class="card" id="card">
  <div class="face front"><span class="tag" id="tf"></span><div class="txt" id="ft"></div><span class="hint">Toca para voltear</span></div>
  <div class="face back"><span class="tag" id="tb"></span><div id="bt"></div></div>
</div></div>
<div class="row">
  <button id="prev">← Anterior</button>
  <button id="rep">Repasar</button>
  <button id="ok" class="p">Lo sé</button>
  <button id="next">Siguiente →</button>
</div>

<script src="cards.js?v=2" onerror="window.CARDS_ERR=1"></script>
<script>
const LIST = (typeof CARDS !== "undefined") ? CARDS : [];

const $ = id => document.getElementById(id);
const KEY = "comsalud_v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const id = c => c.cat + "|" + c.t;

let deck = [], i = 0;

const cats = ["Todas las categorías", ...new Set(LIST.map(c => c.cat))];
$("cat").innerHTML = cats.map((c, n) => `<option value="${n ? c : ""}">${c}</option>`).join("");

function build(shuffle) {
  deck = LIST.filter(c => (!$("cat").value || c.cat === $("cat").value) &&
    ($("filt").value === "all" || state[id(c)] !== "ok"));
  if (shuffle) deck.sort(() => Math.random() - .5);
  i = 0; render();
}

function render() {
  const c = $("card"); c.classList.remove("flip");
  if (!deck.length) {
    $("ft").textContent = LIST.length ? "No hay tarjetas en este filtro." : (window.CARDS_ERR ? "No se pudo cargar cards.js. Verificá que esté en la misma carpeta que index.html." : "Todavía no hay tarjetas en cards.js."); $("bt").innerHTML = "";
    $("tf").textContent = ""; $("tb").textContent = ""; $("stat").textContent = ""; return;
  }
  const k = deck[i], termFirst = $("mode").value === "t";
  const term = `<div class="term">${k.t}</div>`, desc = `<div class="txt">${k.d}</div>`;
  $("ft").innerHTML = termFirst ? term : desc;
  $("bt").innerHTML = termFirst ? desc : term;
  $("tf").textContent = termFirst ? "Término" : "Descripción";
  $("tb").textContent = termFirst ? "Descripción" : "Término";
  const known = LIST.filter(x => state[id(x)] === "ok").length;
  $("stat").textContent = `Tarjeta ${i + 1} de ${deck.length} · Sabidas: ${known}/${LIST.length}`;
}

const go = d => { if (deck.length) { i = (i + d + deck.length) % deck.length; render(); } };
const mark = v => { if (!deck.length) return; state[id(deck[i])] = v; save(); go(1); };

$("card").onclick = () => $("card").classList.toggle("flip");
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("ok").onclick = () => mark("ok");
$("rep").onclick = () => mark("rep");
$("shuf").onclick = () => build(true);
["cat", "mode", "filt"].forEach(x => $(x).onchange = () => build(false));
document.onkeydown = e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); $("card").classList.toggle("flip"); }
};
build(false);
</script>
</body>
</html>
